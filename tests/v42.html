<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>易爻 V4.2 规则驱动回归测试</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:16px;background:#102018;color:#f0e8d2}h1{font-size:24px}pre{line-height:1.65;white-space:pre-wrap;border:1px solid #566;padding:20px;border-radius:10px}.pass{color:#8ed19a}.fail{color:#ffa29a}</style>
<h1>易爻 V4.2 · 回归测试</h1>
<p>此页校验实际卦盘、问题意图、结论一致性与跨领域差异。通过不代表预测准确。</p><pre id="report">加载中…</pre>
<script src="../engine-v3.js?v=4.2.2"></script>
<script src="../engine-v4.js?v=4.2.0"></script>
<script src="../engine-v42.js?v=4.2.2"></script>
<script>
(async()=>{
 const tests=[], add=(label,pass,detail="")=>tests.push({label,pass:!!pass,detail});
 const thrown=[[3,3,2],[2,3,3],[2,3,2],[2,2,2],[3,3,3],[3,3,2]];
 const animals=["白虎","玄武","青龙","朱雀","勾陈","螣蛇"];
 function sampleK(question="未来三个月我的事业走向是什么样的"){
  const gz=["丙辰","丙午","丙申","戊申","戊戌","戊子"],vgz=["丙辰","丙午","丙申","庚午","庚申","庚戌"],
   r=["父母","官鬼","兄弟","兄弟","父母","子孙"],vr=["父母","官鬼","兄弟","官鬼","兄弟","父母"];
  const totals=[8,8,7,6,9,8],bits=totals.map(n=>n%2);
  return {question,t:{day:"庚申"},throwing:thrown,totals,bits,changed:[0,0,1,1,0,0],
   a:{name:"水山蹇",palace:"兑宫",home:"金",shi:4,ying:1},b:{name:"雷山小过"},
   rows:gz.map((v,i)=>({i,gz:v,vgz:vgz[i],r:r[i],vr:vr[i],animal:animals[i],empty:i===5})),empty:["子","丑"],month:"戌",day:"申"};
 }
 function sampleY(question="接下来我还会进新的项目进来吗？"){
  const gz=["庚子","庚寅","庚辰","丙戌","丙子","丙寅"],r=["父母","兄弟","妻财","妻财","父母","兄弟"],
   throwing=[[2,3,2],[2,3,3],[3,3,2],[3,3,2],[3,3,2],[2,2,3]],totals=[7,8,8,8,8,7],bits=totals.map(n=>n%2);
  return {question,t:{day:"庚申"},throwing,totals,bits,changed:bits.slice(),a:{name:"山雷颐",palace:"巽宫",home:"木",shi:4,ying:1},b:{name:"山雷颐"},
    rows:gz.map((v,i)=>({i,gz:v,vgz:v,r:r[i],vr:r[i],animal:animals[i],empty:i===0||i===4})),empty:["子","丑"],month:"戌",day:"申"};
 }
 try{
  await YiYaoEngineV42.load();
  const k=YiYaoEngineV42.interpret(sampleK());
  add("蹇→小过：正确排盘并展示真实动爻",k.verified.includes("水山蹇")&&k.answer.includes("四爻")&&k.answer.includes("五爻"));
  add("蹇→小过：世兄弟发动回头克",k.answer.includes("回头克")&&k.answer.includes("戊申兄弟"));
  add("蹇→小过：没有虚构官鬼持世",!k.answer.includes("官鬼持世")&&!k.html.includes("官鬼持世"));
  add("蹇→小过：与卦义和动爻相关",k.answer.includes("前行受阻")&&k.answer.includes("大蹇朋来"));
  const y=YiYaoEngineV42.interpret(sampleY());
  add("颐静卦：新机会而不是接项目",y.intent.intent==="new_opportunity"&&!y.answer.includes("承接之后"));
  add("颐静卦：无动爻+父母旬空",y.answer.includes("六爻安静")&&y.signals.some(s=>s.kind==="void"));
  add("同一问题不同卦：结论不同",YiYaoEngineV42.interpret(sampleK(sampleY().question)).answer!==y.answer);
  const cases=[
  ["未来三个月这份工作怎么发展？","career"],
  ["未来三个月我会增加收入吗？","finance"],
  ["我和男朋友的感情会怎样？","relationship"],
  ["这份房屋合同能顺利签吗？","property"],
  ["我和合作伙伴还能继续合作吗？","cooperation"],
  ["孩子的兴趣培养以后会怎样？","children"],
  ["最近身体健康如何？","health"],
  ["官司会不会出现变化？","legal"],
  ["这次考试可以通过吗？","exam"]];
  const domains=[];
  for(const [q,field] of cases){const o=YiYaoEngineV42.interpret(sampleK(q));add("领域："+field,o.intent.field===field&&o.answer.includes(o.intent.field==="career"?"职责、项目安排":o.intent.field==="finance"?"财务":o.intent.field==="relationship"?"关系":"")&&o.answer.length>60,o.intent.field);domains.push(o.answer);}
  add("同卦不同领域：内容不一致",new Set(domains).size===domains.length);
  add("健康不做诊断",YiYaoEngineV42.interpret(sampleK("最近身体健康如何？")).html.includes("不通过卦象诊断"));
  // 2026-10-13 16:23 真实卦例：泽风大过→火天大有，初五上爻动。
  function sampleBigOver(){
    const throwing=[[2,2,2],[2,2,3],[2,2,3],[2,2,3],[3,3,3],[2,2,2]],
       totals=[6,7,7,7,9,6],bits=totals.map(n=>n%2),
       gz=["辛丑","辛亥","辛酉","丁亥","丁酉","丁未"],
       vgz=["甲子","甲寅","甲辰","己酉","己未","己巳"],
       r=["妻财","父母","官鬼","父母","官鬼","妻财"],
       vr=["父母","兄弟","妻财","官鬼","妻财","子孙"];
    return {question:"未来五个月我的这份工作的发展会怎么样",t:{day:"庚申"},
       throwing,totals,bits,changed:[1,1,1,1,0,1],
       a:{name:"泽风大过",palace:"震宫",home:"木",shi:4,ying:1},
       b:{name:"火天大有"},
       rows:gz.map((v,i)=>({i,gz:v,vgz:vgz[i],r:r[i],vr:vr[i],animal:animals[i],empty:i===0})),
       empty:["子","丑"],month:"戌",day:"申"};
  }
  const big=YiYaoEngineV42.interpret(sampleBigOver());
  add("大过→大有：正确计算初五上动爻",big.verified.includes("泽风大过")&&big.verified.includes("火天大有")&&big.lineTexts.length===3);
  add("五个月时间范围识别",big.intent.window==="未来五个月",big.intent.window);
  add("上六凶辞不能从核心判断遗漏",big.answer.split("\n")[0].includes("警示")&&big.answer.includes("过涉灭顶"));
  add("三条动爻全部进入核心依据",big.answer.includes("初爻 辛丑")&&big.answer.includes("五爻 丁酉")&&big.answer.includes("上爻 丁未"));
  add("事业官鬼动爻优先于非核心妻财",big.answer.indexOf("五爻 丁酉官鬼")<big.answer.indexOf("初爻 辛丑妻财"));
  add("动爻本变同时旬空可见",big.answer.includes("本爻空、变爻空"));
  const calendar=big.signals.find(x=>x.kind==="calendar");
  add("月日作用于世爻方向明确",calendar.fact.includes("戌克亥")&&calendar.fact.includes("申生亥"),calendar.fact);
  // 2026-10-13 16:33：地山谦→山天大畜，初、二、上三爻发动。
  function sampleQian(){
    const throwing=[[2,2,2],[2,2,2],[2,2,3],[2,3,3],[3,2,3],[2,2,2]],
      totals=[6,6,7,8,8,6],bits=totals.map(n=>n%2),
      gz=["丙辰","丙午","丙申","癸丑","癸亥","癸酉"],
      vgz=["甲子","甲寅","甲辰","丙戌","丙子","丙寅"],
      r=["父母","官鬼","兄弟","父母","子孙","兄弟"],
      vr=["子孙","妻财","父母","父母","子孙","妻财"];
    return {question:"未来五个月我的这份工作的发展会怎么样",t:{day:"庚申"},
      throwing,totals,bits,changed:[1,1,1,0,0,1],
      a:{name:"地山谦",palace:"兑宫",home:"金",shi:5,ying:2},
      b:{name:"山天大畜"},
      rows:gz.map((value,i)=>({i,gz:value,vgz:vgz[i],r:r[i],vr:vr[i],animal:animals[i],empty:i===3})),
      empty:["子","丑"],month:"戌",day:"申"};
  }
  const modest=YiYaoEngineV42.interpret(sampleQian());
  add("谦→大畜：本变卦与初二上动爻准确",modest.verified.includes("地山谦")&&modest.verified.includes("山天大畜")&&modest.lineTexts.length===3);
  add("谦卦：未来五个月时间范围",modest.intent.window==="未来五个月",modest.intent.window);
  add("谦卦：初二上动爻均进入正文",modest.answer.includes("初爻")&&modest.answer.includes("二爻")&&modest.answer.includes("上爻"));
  add("谦卦：动爻的独立象义进入直接结论",modest.answer.split("\n")[0].includes("治理自身职责范围内"));
  add("谦卦：午亥生克受力方明确",modest.signals.some(x=>x.fact.includes("亥克午（午受克）")));
  add("谦卦：初爻变子水旬空，四爻丑土静空",modest.signals.some(x=>x.kind==="void_change"&&x.fact.includes("初"))&&modest.signals.some(x=>x.kind==="void"&&x.fact.includes("四")));
  add("谦卦：世爻为癸亥子孙不是官鬼",modest.answer.includes("癸亥子孙")&&!modest.answer.includes("官鬼持世"));
  // 2026-10-13 16:43 固定六爻：风水涣→火地晋，二、四、五爻发动。
  function samplePromotion(question="什么时候能升职"){
   const throwing=[[3,3,2],[3,3,3],[2,3,3],[2,2,2],[3,3,3],[2,3,2]],
      totals=[8,9,8,6,9,7],bits=totals.map(n=>n%2),
      gz=["戊寅","戊辰","戊午","辛未","辛巳","辛卯"],
      vgz=["乙未","乙巳","乙卯","己酉","己未","己巳"],
      r=["父母","子孙","兄弟","子孙","兄弟","父母"],
      vr=["子孙","兄弟","父母","妻财","子孙","兄弟"];
   return {question,t:{day:"庚申"},throwing,totals,bits,changed:[0,0,0,1,0,1],
     a:{name:"风水涣",palace:"离宫",home:"火",shi:5,ying:2},b:{name:"火地晋"},
     rows:gz.map((v,i)=>({i,gz:v,vgz:vgz[i],r:r[i],vr:vr[i],animal:animals[i],empty:false})),
     empty:["子","丑"],month:"戌",day:"申"};
  }
  const promo=YiYaoEngineV42.interpret(samplePromotion());
  add("升职案例：风水涣变火地晋，二四五动",promo.verified.includes("风水涣")&&promo.verified.includes("火地晋")&&promo.lineTexts.length===3);
  add("升职问题专属意图",promo.intent.intent==="timing"&&promo.intent.object?.subtype==="promotion");
  add("升职结论聚焦职位晋升",promo.answer.split("\n")[0].includes("什么时候能升职")&&promo.answer.includes("职务晋升"));
  add("本卦官鬼不现：不编造晋升应期",promo.answer.includes("未见官鬼爻")&&promo.answer.includes("伏神")&&!/\d{4}年\d{1,2}月必/.test(promo.answer));
  add("涣九二悔亡不再误判为警示",!promo.answer.includes("二爻存在明确的警示爻辞")&&!promo.answer.includes("二爻「九二")?promo.answer.includes("悔亡"):!promo.answer.includes("【警示】")&&!promo.answer.includes("明确的警示爻辞"));
  add("涣六四元吉和九五无咎进入传统象义",promo.answer.includes("元吉")&&promo.answer.includes("涣王居")&&promo.answer.includes("传统上为吉"));
  add("未设限时间不再伪称用户指定接下来",promo.answer.includes("用户没有限定具体时间跨度")&&!promo.answer.includes("用户给定的观察范围"));
  add("升职案例所有动爻纳入结论",promo.answer.includes("二爻")&&promo.answer.includes("四爻")&&promo.answer.includes("五爻"));
  const promoTrend=YiYaoEngineV42.interpret(samplePromotion("未来五个月我目前的职业发展会怎样"));
  add("同卦升职与事业发展细分不同",promoTrend.intent.object?.subtype!=="promotion"&&!promoTrend.answer.includes("未见官鬼爻，须结合尚未校验"));
  const corrupt=sampleK();corrupt.a.shi=2;
  try {YiYaoEngineV42.interpret(corrupt);add("错误世应必须阻止或复核",false,"原有 V4 verify 未独立核对世应");}
  catch(e){add("错误世应必须阻止或复核",true,String(e));}
 }catch(e){add("执行过程",false,e.stack||String(e));}
 document.getElementById("report").textContent=tests.map(x=>(x.pass?"PASS":"FAIL")+" "+x.label+(x.detail?" — "+x.detail:"")).join("\n")+"\n\n通过 "+tests.filter(x=>x.pass).length+" / "+tests.length;
})();
</script></html>
